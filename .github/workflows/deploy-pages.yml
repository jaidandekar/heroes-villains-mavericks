name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'editorial-preview/release-request.txt'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require production branch
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate site and maintenance tools
        run: |
          python3 -B tools/check_project.py
          python3 -B -m unittest discover -s tools/tests -v
          python3 -B tools/test_resolver.py

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'

      - name: Build editorial pages
        working-directory: editorial-preview
        env:
          ASTRO_TELEMETRY_DISABLED: '1'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Assemble and validate release
        working-directory: editorial-preview
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 -B scripts/prepare-release.py --public-url "$PAGES_BASE_URL" --output release

      - name: Upload release
        uses: actions/upload-pages-artifact@v3
        with:
          path: editorial-preview/release

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
