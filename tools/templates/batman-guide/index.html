      if (item.wikipedia) links.push('<a href="' + item.wikipedia + '" target="_blank" rel="noopener">Wikipedia</a>');
      if (item.imdb) links.push('<a href="' + item.imdb + '" target="_blank" rel="noopener">IMDb</a>');
      return '<article class="screen-item">' +
        screenPosterTag(item) +
        '<div class="screen-item-body">' +
        '<h3>' + item.title + '</h3>' +
        '<p class="screen-item-meta">' + when + (item.note ? ' · ' + item.note : '') + '</p>' +
        (links.length ? '<div class="screen-item-links">' + links.join('') + '</div>' : '') +
        '</div></article>';
    }

    function renderScreenSection() {
      var groupsHtml = BATMAN_SCREEN.map(function(g) {
        return '<div class="screen-group">' +
          '<h3 class="screen-group-title">' + g.group + '</h3>' +
          '<div class="screen-list">' + g.items.map(renderScreenItem).join('') + '</div></div>';
      }).join('');
      var totalCount = BATMAN_SCREEN.reduce(function(n, g) { return n + g.items.length; }, 0);
      return '<section class="home-section section" id="on-screen">' +
        '<div class="section-header"><div>' +
        '<h2>Movies &amp; TV Series</h2>' +
        '<p>Every major live-action and animated appearance — from the 1966 camp classic and Burton films to the DCAU, Nolan trilogy, and The Batman.</p>' +
        '</div><span class="section-badge">' + totalCount + ' titles</span></div>' +
        groupsHtml + '</section>';
    }

    function renderFeaturedVersionRow(v) {
      var desc = v.description || '';
      var copyId = 'featured-copy-' + v.slug;
      var theme = getFeaturedThemeColor(v.slug, null);
      var overlayStyle = ' style="background:' + buildFeaturedOverlayGradient(theme) + '"';
      var copyClass = 'featured-version-copy featured-version-copy--on-dark';
      var mediaNote = v.media && v.media.length
        ? '<span>Also in Movies &amp; TV below</span>'
        : '';
      var wikiAttr = v.wikipedia ? ' data-wikipedia="' + escAttr(v.wikipedia) + '"' : '';
      var maxRuns = 3;
      var visibleRuns = (v.runs || []).slice(0, maxRuns);
      var shopBlocks = visibleRuns.map(function(runSlug) {
        var run = getRun(runSlug);
        if (!run) return '';
        var links = runShopLinksHtml(runSlug);
        if (!links) return '';
        return '<div class="featured-version-shop" data-run="' + escAttr(runSlug) + '">' +
          '<span class="featured-version-more-runs">' + run.title + '</span>' + links + '</div>';
      }).join('');
      if ((v.runs || []).length > maxRuns) {
        shopBlocks += '<span class="featured-version-more-runs">+' + (v.runs.length - maxRuns) + ' more collected edition' + (v.runs.length - maxRuns === 1 ? '' : 's') + ' in Graphic Novels below</span>';
      }
      var runsNote = (v.runs && v.runs.length)
        ? '<span>' + v.runs.length + ' essential run' + (v.runs.length === 1 ? '' : 's') + '</span>'
        : '';
      return '<section class="featured-version-row" id="featured-' + v.slug + '" data-type="' + v.type + '">' +
        '<div class="featured-version-link featured-version-link--static" data-slug="' + v.slug + '">' +
        '<div class="featured-version-bg">' + featuredImgTag(v.slug, v.name, copyId) + '</div>' +
        '<div class="featured-version-overlay"' + overlayStyle + '></div>' +
        '<div class="' + copyClass + '" id="' + copyId + '">' +
        '<span class="featured-version-label">' + (typeLabels[v.type] || v.type) + '</span>' +
        '<h2>' + v.name + '</h2>' +
        '<p class="featured-version-tagline">' + v.tagline + '</p>' +
        '<p class="featured-version-desc"' + wikiAttr + '>' + desc + '</p>' +
        '<div class="featured-version-meta">' +
        '<span>' + v.universe + '</span>' +
        runsNote +
        mediaNote +
        '<span>' + v.firstAppearance + '</span></div>' +
        shopBlocks +
        '</div></div></section>';
    }

    function renderHome() {
      return '<div class="page" id="page-home">' +
        renderWhoIsBatman() +
        renderVersesSection() +
        renderEssentialRunsSection() +
        renderScreenSection() +
        '</div>';
    }

    function renderRunBody(slug) {
      var run = getRun(slug);
      if (!run) return '';
      var orderHtml = run.readingOrder.map(function(item) { return '<li>' + item + '</li>'; }).join('');
      var productHtml = run.amazon.map(function(p) {
        var thumb = imgTag(slug, p.title);
        return '<a href="' + amazonUrl(p.asin) + '" target="_blank" rel="noopener sponsored" class="product-card">' +
          '<div class="product-thumb">' + (thumb || '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:1.5rem;opacity:0.3">🦇</div>') + '</div>' +
          '<div class="product-info"><h4>' + p.title + '</h4>' +
          '<span>' + p.format + (p.recommended ? ' · Recommended' : '') + '</span></div>' +
          '<span class="product-cta">Buy →</span></a>';
      }).join('');
      return '<div class="run-layout">' +
        '<div class="run-cover-card">' +
        '<div class="run-cover-wrap">' + imgTag(slug, run.title) + '</div>' +
        '<div class="run-cover-meta">' + run.collects + '<br>' + run.era + '</div></div>' +
        '<div class="run-detail">' +
        '<h1>' + run.title + '</h1>' +
        '<p class="creators">' + run.creators + '</p>' +
        '<p class="summary">' + run.summary + '</p>' +
        '<div class="info-grid">' +
        '<div class="info-box"><label>Years</label><span>' + run.years + '</span></div>' +
        '<div class="info-box"><label>Collects</label><span>' + run.collects + '</span></div>' +
        '<div class="info-box"><label>Era</label><span>' + run.era + '</span></div>' +
        '<div class="info-box"><label>Prerequisites</label><span>' + run.prerequisites + '</span></div></div>' +
        renderIssueInventory(slug) +
        '<div class="reading-order"><h2 class="block-title">Collected editions</h2><ol>' + orderHtml + '</ol></div>' +
        '<div class="buy-section"><h2 class="block-title">Where to buy</h2>' +
        '<div class="product-grid">' + productHtml + '</div>' +
        '<p class="disclosure">As an Amazon Associate we earn from qualifying purchases. Replace YOURTAG-20 with your affiliate tag.</p>' +
        '</div></div></div>';
    }

    function renderRun(slug) {
      var run = getRun(slug);
      if (!run) return renderHome();

      var version = getVersion(run.versionSlug);

      return '<div class="page" id="page-run">' +
        '<div class="breadcrumb"><a href="#home">Home</a> / ' +
        '<a href="#verses">' + version.name + '</a> / <span>' + run.title + '</span></div>' +
        renderRunBody(slug) + '</div>';
    }

    function hydrateVersionDescriptions() {
      document.querySelectorAll('.featured-version-desc[data-wikipedia]').forEach(function(el) {
        if (el.dataset.wikiHydrated === 'true') return;
        var wiki = el.getAttribute('data-wikipedia');
        if (!wiki) return;
        var title = '';
        try {
          var parts = wiki.split('/wiki/');
          title = parts.length > 1 ? decodeURIComponent(parts[1]) : '';
        } catch (err) { title = ''; }
        if (!title) return;
        el.dataset.wikiHydrated = 'pending';
        fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')), {
          headers: { 'Accept': 'application/json' }
        }).then(function(resp) { return resp.ok ? resp.json() : null; }).then(function(data) {
          if (!data || !data.extract) {
            el.dataset.wikiHydrated = 'false';
            return;
          }
          var extract = String(data.extract).trim();
          var current = (el.textContent || '').trim();
          if (extract.length > current.length + 40) {
            el.textContent = extract;
          }
          el.dataset.wikiHydrated = 'true';
        }).catch(function() {
          el.dataset.wikiHydrated = 'false';
        });
      });
    }

    function route() {
      var hash = location.hash.slice(1) || 'home';
      var app = document.getElementById('app');
      var isVersion = hash.indexOf('version/') === 0;
      var isRun = hash.indexOf('run/') === 0;

      if (isVersion) {
        location.replace('#verses');
        return;
      } else if (isRun) {
        window.scrollTo(0, 0);
        app.innerHTML = renderRun(hash.replace('run/', ''));
      } else {
        app.innerHTML = renderHome();
        initFeaturedRows();
        hydrateScreenPosters();
        hydrateVersionDescriptions();
        var scrollTarget = (hash === 'home' || !hash) ? null : (hash === 'all-versions' ? 'verses' : hash);
        if (scrollTarget) {
          requestAnimationFrame(function() {
            var el = document.getElementById(scrollTarget);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
            else window.scrollTo(0, 0);
          });
        } else {
          window.scrollTo(0, 0);
        }
      }
    }

    function refreshCoverSources() {
      Object.keys(COVER_SOURCES).forEach(function(k) { delete COVER_SOURCES[k]; });
      buildCoverSourceIndex();
    }

    refreshCoverSources();
    window.addEventListener('hashchange', route);
    window.addEventListener('load', route);

    (function () {
      var chrome = document.querySelector('.site-chrome');
      if (!chrome) return;
      var ticking = false;
      var ON = 24;
      var OFF = 8;
      var scrolled = false;
      function update() {
        ticking = false;
        var y = window.scrollY || 0;
        if (!scrolled && y > ON) {
          scrolled = true;
          chrome.classList.add('is-scrolled');
        } else if (scrolled && y < OFF) {
          scrolled = false;
          chrome.classList.remove('is-scrolled');
        }
      }
      function onScroll() {
        if (!ticking) {
          ticking = true;
          window.requestAnimationFrame(update);
        }
      }
      window.addEventListener('scroll', onScroll, { passive: true });
      update();
    })();
  </script>
</body>
</html>
