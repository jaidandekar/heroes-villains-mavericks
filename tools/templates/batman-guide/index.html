<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Batman — The Dark Knight in Every Form</title>
  <link rel="preconnect" href="https://covers.openlibrary.org">
  <link rel="preconnect" href="https://books.google.com">
  <link rel="preconnect" href="https://images-na.ssl-images-amazon.com">
  <link rel="preconnect" href="https://upload.wikimedia.org">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --bg-subtle: #f7f7f8;
      --surface: #ffffff;
      --surface-2: #f5f5f7;
      --surface-3: #ebebed;
      --border: #e4e4e7;
      --border-light: #f0f0f2;
      --text: #1d1d1f;
      --text-secondary: #48484a;
      --muted: #6e6e73;
      --accent: #1d1d1f;
      --accent-hover: #000000;
      --link: #0066cc;
      --link-hover: #004499;
      --radius: 16px;
      --radius-sm: 12px;
      --radius-pill: 999px;
      --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.06);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 12px 32px rgba(0,0,0,0.1);
      --shadow-card: 0 6px 20px rgba(0,0,0,0.08);
      --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
      --content-max: min(1920px, calc(100vw - 4rem));
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    /* Stacked chrome: HVM site header + guide bar */
    .site-chrome {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #ffffff;
      border-bottom: 1px solid var(--border-light);
    }

    .site-header {
      background: #ffffff;
      transition: box-shadow 0.28s var(--ease);
    }

    .site-header-inner {
      width: min(100%, var(--content-max, 72rem));
      margin: 0 auto;
      padding: 0.85rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
    }

    .site-header-title {
      font-size: clamp(0.95rem, 1.6vw, 1.1rem);
      font-weight: 900;
      letter-spacing: -0.01em;
      color: var(--text);
      line-height: 1.2;
      margin: 0;
      min-width: 0;
    }

    .site-header-home {
      color: inherit;
      text-decoration: none;
    }

    .site-header-home:hover { color: var(--text); }

    .site-header-by {
      font-weight: 600;
      letter-spacing: 0;
      color: #5BA4E6;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .site-header-by:hover { color: #3D8FD9; }

    .site-header-portfolio {
      flex-shrink: 0;
      font-size: 0.8125rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      text-decoration: none;
      color: #5BA4E6;
      transition: color 0.2s ease;
      text-align: right;
      white-space: nowrap;
    }

    .site-header-portfolio:hover { color: #3D8FD9; }

    .site-chrome.is-scrolled {
      box-shadow: 0 10px 28px rgba(26, 28, 30, 0.1);
    }

    .guide-bar {
      border-top: 1px solid var(--border-light);
      background: var(--bg-subtle);
    }

    .guide-bar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      width: min(100%, var(--content-max, 72rem));
      margin: 0 auto;
      padding: 0.45rem 2rem 0.55rem;
    }

    .guide-bar-brand {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      min-width: 0;
    }

    .guide-back {
      flex: 0 0 auto;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5rem;
      height: 1.5rem;
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      line-height: 1;
      border-radius: 0.3rem;
      transition: background 0.2s var(--ease), color 0.2s var(--ease);
    }

    .guide-back:hover {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-secondary);
    }

    .logo {
      font-size: 0.8125rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-decoration: none;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .logo:hover { color: var(--text); }

    .logo span { color: var(--muted); font-weight: 500; }

    .guide-bar nav { display: flex; gap: 1.1rem; flex-wrap: wrap; align-items: center; }

    .guide-bar nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: color 0.2s var(--ease);
    }

    .guide-bar nav a:hover { color: var(--text-secondary); }

    main {
      position: relative;
      z-index: 1;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 0 2rem 5rem;
    }

    @media (max-width: 640px) {
      .site-header-inner,
      .guide-bar-inner { padding-left: 1.25rem; padding-right: 1.25rem; }
      .guide-bar-inner { flex-wrap: wrap; }
      .logo { font-size: 0.75rem; white-space: normal; }
      main { padding: 0 1.25rem 4rem; }
    }

    .page { animation: fadeIn 0.35s ease; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Home: Who is Batman ── */
    .home-section {
      margin-bottom: 4rem;
      scroll-margin-top: 5rem;
    }

    .home-full-bleed {
      width: 100vw;
      max-width: 100vw;
      margin-left: calc(50% - 50vw);
      margin-right: calc(50% - 50vw);
    }

    .intro-banner {
      position: relative;
      min-height: min(72vh, 640px);
      display: flex;
      align-items: flex-end;
      overflow: hidden;
      margin-bottom: 2.5rem;
    }

    .intro-banner-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .intro-banner-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      display: block;
    }

    .intro-banner-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 45%, rgba(0,0,0,0.15) 100%);
    }

    .intro-banner-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 3rem 2rem 2.5rem;
      color: #f5f5f7;
    }

    .intro-banner-content h1 {
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      margin-bottom: 0.75rem;
    }

    .intro-lead {
      font-size: clamp(1.125rem, 2.5vw, 1.375rem);
      line-height: 1.5;
      color: rgba(245, 245, 247, 0.88);
      max-width: 640px;
      font-weight: 500;
    }

    .intro-body {
      max-width: 820px;
    }

    .intro-summary {
      font-size: 1.0625rem;
      line-height: 1.7;
      color: var(--text-secondary);
      margin-bottom: 2rem;
    }

    .intro-facts {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1rem 1.5rem;
      margin-bottom: 1.5rem;
    }

    .intro-fact {
      padding: 1rem 1.15rem;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }

    .intro-fact-label {
      display: block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .intro-fact-value {
      display: block;
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.4;
    }

    .wiki-attribution {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--link);
      text-decoration: none;
    }

    .wiki-attribution:hover { color: var(--link-hover); text-decoration: underline; }

    /* ── Home: essential runs row ── */
    .essential-runs-grid,
    .run-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .essential-runs-grid,
      .run-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (min-width: 1100px) {
      .essential-runs-grid,
      .run-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 1.15rem;
      }
    }

    /* ── Home: screen media groups ── */
    .screen-group {
      margin-bottom: 2.5rem;
    }

    .screen-group:last-child { margin-bottom: 0; }

    .screen-group-title {
      font-size: 0.8125rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border-light);
    }

    .screen-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(168px, 1fr));
      gap: 1.25rem;
    }

    @media (min-width: 900px) {
      .screen-list {
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      }
    }

    .screen-item {
      display: flex;
      flex-direction: column;
      padding: 0;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: box-shadow 0.2s var(--ease), transform 0.2s var(--ease);
    }

    .screen-item:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
    }

    .screen-item-poster {
      aspect-ratio: 2 / 3;
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
    }

    .screen-item-poster img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s var(--ease);
    }

    .screen-item:hover .screen-item-poster img {
      transform: scale(1.04);
    }

    .screen-item-poster.no-img::after {
      content: '🎬';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      opacity: 0.2;
    }

    .screen-item-body {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      padding: 1rem 1.1rem 1.15rem;
      flex: 1;
    }

    .screen-item h3 {
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.35;
      color: var(--text);
    }

    .screen-item-meta {
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .screen-item-links {
      display: flex;
      gap: 1rem;
      margin-top: 0.35rem;
    }

    .screen-item-links a {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--link);
      text-decoration: none;
    }

    .screen-item-links a:hover { text-decoration: underline; }

    /* ── Hero (legacy, unused on home) ── */
    .hero {
      text-align: center;
      padding: 3.5rem 1rem 2.5rem;
      max-width: 680px;
      margin: 0 auto;
    }

    .hero h1 {
      font-size: clamp(2.25rem, 5.5vw, 3.25rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.08;
      margin-bottom: 0.85rem;
      color: var(--text);
    }

    .hero p {
      color: var(--muted);
      font-size: 1.125rem;
      font-weight: 400;
      line-height: 1.55;
      max-width: 540px;
      margin: 0 auto 1.75rem;
    }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .stat-pill {
      padding: 0.45rem 1rem;
      background: var(--surface-2);
      border: none;
      border-radius: var(--radius-pill);
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }

    .stat-pill strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ── Sections ── */
    .section {
      margin-bottom: 3.5rem;
    }

    .section-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .section-header h2 {
      font-size: 1.375rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .section-header p {
      color: var(--muted);
      font-size: 0.9375rem;
      margin-top: 0.35rem;
      line-height: 1.5;
      max-width: 520px;
    }

    .section-badge {
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.35rem 0.75rem;
      border-radius: var(--radius-pill);
      background: var(--surface-2);
      color: var(--text-secondary);
      white-space: nowrap;
    }

    .see-all {
      color: var(--link);
      text-decoration: none;
      font-size: 0.875rem;
      font-weight: 500;
    }

    .see-all:hover { color: var(--link-hover); text-decoration: underline; }

    .verses-explore-cta {
      text-align: center;
      margin-top: 0.5rem;
    }

    .verses-explore-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      min-height: 48px;
      padding: 0.75rem 1.75rem;
      font-size: 0.9375rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: var(--radius-pill);
      text-decoration: none;
      cursor: pointer;
      box-shadow: none;
      transition: background 0.18s var(--ease), transform 0.12s var(--ease);
    }

    .verses-explore-link:hover {
      background: var(--link);
      transform: none;
      box-shadow: none;
    }

    .verses-explore-link:active {
      background: var(--link-hover);
      transform: scale(0.98);
    }

    .verses-explore-link:focus-visible {
      outline: 2px solid var(--link);
      outline-offset: 3px;
    }

    /* ── Homepage featured rows ── */
    .featured-version-rows {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.25rem;
      margin-bottom: 1.75rem;
    }

    @media (max-width: 900px) {
      .featured-version-rows {
        grid-template-columns: 1fr;
      }
    }

    .featured-version-row {
      margin-bottom: 0;
      min-width: 0;
    }

    .featured-version-link {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      min-height: 460px;
      height: 100%;
      text-decoration: none;
      color: inherit;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: var(--surface-2);
      transition: box-shadow 0.25s var(--ease), transform 0.25s var(--ease);
    }

    .featured-version-link:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .featured-version-bg {
      position: absolute;
      inset: 0;
      z-index: 0;
    }

    .featured-version-bg img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Bias below center so Multiverse banners show cover art, not masthead lettering. */
      object-position: center 65%;
      display: block;
      transition: transform 0.55s var(--ease);
    }

    .featured-version-link:hover .featured-version-bg img {
      transform: scale(1.05);
    }

    .featured-version-overlay {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      /* Always-dark base scrim so light covers never wash out the type */
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.92) 0%,
        rgba(0, 0, 0, 0.78) 32%,
        rgba(0, 0, 0, 0.42) 58%,
        rgba(0, 0, 0, 0.18) 78%,
        rgba(0, 0, 0, 0.06) 100%
      );
      transition: opacity 0.45s var(--ease);
    }

    .featured-version-link:hover .featured-version-overlay {
      opacity: 0.96;
    }

    .featured-version-copy {
      position: relative;
      z-index: 2;
      flex: 0 0 auto;
      min-width: 0;
      padding: 2rem 1.5rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-start;
      text-align: left;
      background: transparent;
      transition: color 0.3s var(--ease);
    }

    /* Extra text-panel wash sitting under the copy, above the image overlay.
       Uses --featured-theme-rgb when set so cards keep distinct color identity. */
    .featured-version-copy::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      top: -35%;
      z-index: -1;
      pointer-events: none;
      background: linear-gradient(
        to top,
        rgba(0, 0, 0, 0.78) 0%,
        rgba(var(--featured-theme-rgb, 0, 0, 0), 0.58) 42%,
        rgba(var(--featured-theme-rgb, 0, 0, 0), 0.22) 72%,
        rgba(0, 0, 0, 0) 100%
      );
    }

    @media (max-width: 768px) {
      .featured-version-copy { padding: 1.5rem 1.25rem 1.75rem; }
    }

    .featured-version-copy--on-dark {
      color: #f5f5f7;
    }

    .featured-version-copy--on-dark h2 {
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }

    .featured-version-copy--on-dark .featured-version-tagline,
    .featured-version-copy--on-dark .featured-version-desc {
      text-shadow: 0 1px 12px rgba(0, 0, 0, 0.5);
    }

    .featured-version-copy--on-dark .featured-version-label,
    .featured-version-copy--on-dark .featured-version-desc,
    .featured-version-copy--on-dark .featured-version-meta {
      color: rgba(245, 245, 247, 0.88);
    }

    .featured-version-copy--on-dark .featured-version-tagline {
      color: rgba(245, 245, 247, 0.95);
    }

    .featured-version-copy--on-dark .featured-version-meta span {
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .featured-version-copy--on-dark .featured-version-cta {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .featured-version-copy--on-dark .featured-version-cta:hover {
      background: #fff;
      border-color: #fff;
      color: var(--text);
    }

    .featured-version-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.65rem;
    }

    .featured-version-copy h2 {
      font-size: clamp(1.75rem, 3.5vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
    }

    .featured-version-tagline {
      font-size: 1.125rem;
      font-weight: 500;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 0.85rem;
    }

    .featured-version-desc {
      font-size: 0.9375rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 1rem;
      max-width: none;
    }

    .featured-version-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 1.25rem;
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }

    .featured-version-meta span {
      padding: 0.3rem 0.65rem;
      background: rgba(0, 0, 0, 0.06);
      border-radius: var(--radius-pill);
    }

    .featured-version-cta {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--link);
      padding: 0.55rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    .featured-version-link:hover .featured-version-cta {
      background: #fff;
      border-color: #fff;
      color: var(--text);
    }

    .featured-version-link--static {
      cursor: default;
    }

    .featured-version-run-links {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.45rem;
      margin-top: 0.35rem;
    }

    .featured-version-run-link {
      font-size: 0.8125rem;
      font-weight: 600;
      color: #fff;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: var(--radius-pill);
      text-decoration: none;
      transition: background 0.18s var(--ease), border-color 0.18s var(--ease), color 0.18s var(--ease);
    }

    .featured-version-copy--on-dark .featured-version-run-link:hover {
      background: #fff;
      border-color: #fff;
      color: var(--text);
    }

    .featured-version-more-runs {
      font-size: 0.75rem;
      font-weight: 500;
      color: rgba(245, 245, 247, 0.65);
      padding: 0.15rem 0.25rem 0;
    }

    .featured-version-shop {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 0.85rem;
      margin-top: 0.35rem;
    }

    .featured-version-shop .run-shop-link {
      color: inherit;
      opacity: 0.92;
    }

    .featured-version-copy--on-dark .featured-version-shop .run-shop-link {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .run-shop-link {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--link);
      text-decoration: none;
    }

    .run-shop-link::after {
      content: '→';
      font-size: 0.85em;
      line-height: 1;
      transform: translateY(0.02em);
    }

    .run-shop-link:hover {
      color: var(--link-hover);
      text-decoration: underline;
    }

    /* ── Run cards (horizontal: cover left, text right) ── */
    .run-card {
      display: flex;
      flex-direction: row;
      align-items: stretch;
      min-height: 248px;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    @media (min-width: 640px) {
      .run-card {
        min-height: 272px;
      }
    }

    .run-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .run-card-cover {
      flex: 0 0 132px;
      width: 132px;
      align-self: stretch;
      background: var(--surface-2);
      position: relative;
      overflow: hidden;
      border-radius: 0;
    }

    @media (min-width: 640px) {
      .run-card-cover {
        flex: 0 0 156px;
        width: 156px;
      }
    }

    @media (min-width: 1100px) {
      .run-card-cover {
        flex: 0 0 168px;
        width: 168px;
      }
    }

    .run-card-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s var(--ease);
    }

    .run-card:hover .run-card-cover img {
      transform: scale(1.04);
    }

    .run-card-cover.no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface-2);
    }

    .run-card-cover.no-img::after {
      content: '✨';
      font-size: 2rem;
      opacity: 0.2;
    }

    .run-card-year {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 0.625rem;
      font-weight: 600;
      padding: 0.2rem 0.45rem;
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .run-card-body {
      flex: 1;
      min-width: 0;
      padding: 1rem 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.25rem;
      border-top: none;
    }

    .run-card-body h3 {
      font-size: 1rem;
      font-weight: 800;
      line-height: 1.25;
      letter-spacing: -0.025em;
      color: var(--text);
    }

    .run-card-creators {
      font-size: 0.8125rem;
      color: var(--text-secondary);
      line-height: 1.4;
      font-weight: 500;
    }

    .run-card-meta {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
    }

    .run-card-summary {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.4;
      margin-top: 0.1rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .run-card-character {
      display: inline-block;
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
    }

    .run-card-cta {
      margin-top: 0.35rem;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--link);
      transition: color 0.2s var(--ease);
    }

    .run-card:hover .run-card-cta {
      color: var(--link-hover);
    }

    /* ── Version cards ── */
    .version-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
    }

    .version-card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.25s var(--ease), box-shadow 0.25s var(--ease);
    }

    .version-card:hover {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
    }

    .version-card-image {
      aspect-ratio: 4/5;
      position: relative;
      overflow: hidden;
      background: var(--surface-2);
      border-radius: 0;
    }

    .version-card-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.45s var(--ease);
    }

    .version-card:hover .version-card-image img {
      transform: scale(1.04);
    }

    .version-card-image.no-img {
      background: var(--surface-2);
    }

    .version-card-image.no-img::after {
      content: '🦇';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      opacity: 0.15;
    }

    .version-card-image::after {
      content: none;
    }

    .version-card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 1;
      font-size: 0.6875rem;
      font-weight: 600;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(8px);
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .version-card-body {
      padding: 1rem 1.15rem 1.2rem;
      border-top: 1px solid var(--border-light);
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .version-card-body h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.35rem;
      line-height: 1.3;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .version-card-body p {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.45;
      flex: 1;
    }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.5rem;
      padding-bottom: 0.25rem;
    }

    .filter-btn {
      padding: 0.5rem 1rem;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-secondary);
      font-size: 0.8125rem;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s var(--ease);
      white-space: nowrap;
    }

    .filter-btn:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .filter-btn.active {
      border-color: var(--text);
      color: var(--bg);
      background: var(--text);
    }

    /* ── Path cards ── */
    .path-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
    }

    .path-card {
      padding: 1.25rem;
      background: var(--surface);
      border: none;
      border-radius: var(--radius-sm);
      box-shadow: var(--shadow);
    }

    .path-card h4 {
      font-size: 0.9375rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .path-card p { font-size: 0.8125rem; color: var(--muted); }

    /* ── Version page hero ── */
    .version-banner {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 2.5rem;
      align-items: start;
      margin-bottom: 2.5rem;
      padding-top: 1.5rem;
    }

    @media (max-width: 768px) {
      .version-banner {
        grid-template-columns: 1fr;
        gap: 1.5rem;
      }
    }

    .version-banner-visual {
      position: relative;
    }

    .version-banner-bg {
      aspect-ratio: 4/5;
      border-radius: var(--radius);
      background-size: cover;
      background-position: center top;
      box-shadow: var(--shadow-card);
      background-color: var(--surface-2);
    }

    .version-banner-bg.no-img {
      background: var(--surface-2);
    }

    .version-banner-content {
      padding: 0.5rem 0 0;
    }

    .version-banner h1 {
      font-size: clamp(1.875rem, 4vw, 2.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 0.5rem;
      color: var(--text);
    }

    .version-banner .tagline {
      color: var(--text-secondary);
      font-size: 1.125rem;
      font-weight: 500;
      margin-bottom: 1rem;
      line-height: 1.4;
    }

    .version-meta {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1.25rem;
    }

    .meta-tag {
      font-size: 0.8125rem;
      padding: 0.35rem 0.75rem;
      background: var(--surface-2);
      border-radius: var(--radius-pill);
      color: var(--text-secondary);
      font-weight: 500;
    }

    .version-description {
      color: var(--muted);
      max-width: 640px;
      line-height: 1.65;
      font-size: 1rem;
    }

    .wiki-link {
      display: inline-block;
      margin-top: 1.25rem;
      color: var(--link);
      font-size: 0.875rem;
      font-weight: 500;
      text-decoration: none;
    }

    .wiki-link:hover { color: var(--link-hover); text-decoration: underline; }

    .wiki-links {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: 1rem;
    }

    .version-run-merged {
      margin-top: 0.5rem;
    }

    .version-run-merged .section-header {
      margin-bottom: 1.75rem;
    }

    .version-run-merged .run-layout {
      margin-top: 0;
    }
    .breadcrumb {
      font-size: 0.875rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      padding-top: 1.25rem;
      font-weight: 500;
    }

    .breadcrumb a {
      color: var(--text-secondary);
      text-decoration: none;
    }

    .breadcrumb a:hover { color: var(--text); text-decoration: underline; }

    .run-layout {
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 3rem;
      align-items: start;
    }

    @media (max-width: 768px) {
      .run-layout { grid-template-columns: 1fr; gap: 2rem; }
    }

    .run-cover-card {
      background: transparent;
      border: none;
      border-radius: var(--radius);
      overflow: hidden;
      position: sticky;
      top: 5.5rem;
    }

    .run-cover-wrap {
      aspect-ratio: 2/3;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
      overflow: hidden;
      box-shadow: var(--shadow-card);
    }

    .run-cover-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .run-cover-wrap.no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
      opacity: 0.12;
    }

    .run-cover-meta {
      padding: 1rem 0.15rem 0;
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .run-detail h1 {
      font-size: clamp(1.875rem, 4vw, 2.375rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.15;
      margin-bottom: 0.4rem;
      color: var(--text);
    }

    .run-detail .creators {
      color: var(--text-secondary);
      font-size: 1.0625rem;
      font-weight: 500;
      margin-bottom: 1.5rem;
    }

    .run-detail .summary {
      color: var(--muted);
      line-height: 1.7;
      margin-bottom: 2rem;
      font-size: 1.0625rem;
    }

    .info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2.25rem;
    }

    .info-box {
      background: var(--surface-2);
      border: none;
      border-radius: var(--radius-sm);
      padding: 1rem 1.1rem;
    }

    .info-box label {
      font-size: 0.6875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      display: block;
      margin-bottom: 0.35rem;
    }

    .info-box span {
      font-weight: 600;
      font-size: 0.9375rem;
      line-height: 1.35;
      color: var(--text);
    }

    .block-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      color: var(--text);
    }

    .reading-order ol {
      list-style: none;
      counter-reset: order;
      margin-bottom: 2.25rem;
    }

    .reading-order li {
      counter-increment: order;
      padding: 0.9rem 1.1rem 0.9rem 3rem;
      background: var(--surface-2);
      border: none;
      border-radius: var(--radius-sm);
      margin-bottom: 0.5rem;
      position: relative;
      font-size: 0.9375rem;
      color: var(--text-secondary);
    }

    .reading-order li::before {
      content: counter(order);
      position: absolute;
      left: 1.1rem;
      font-weight: 600;
      font-size: 0.875rem;
      color: var(--muted);
    }

    /* ── Issue inventory ── */
    .issue-inventory {
      margin-bottom: 2.25rem;
    }

    .issue-inventory-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.75rem;
    }

    .issue-count {
      font-size: 0.8125rem;
      color: var(--muted);
      font-weight: 500;
    }

    .issue-note {
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 0.85rem;
      padding: 0.85rem 1rem;
      background: var(--surface-2);
      border-radius: var(--radius-sm);
    }

    .issue-list {
      list-style: none;
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      overflow: hidden;
    }

    .issue-list li {
      display: grid;
      grid-template-columns: 52px minmax(120px, 32%) 1fr;
      gap: 0.75rem 1rem;
      padding: 0.7rem 1rem;
      font-size: 0.875rem;
      border-bottom: 1px solid var(--border-light);
      align-items: center;
    }

    .issue-list li.issue-row-no-cover {
      grid-template-columns: minmax(140px, 38%) 1fr;
    }

    .issue-thumb {
      width: 52px;
      height: 78px;
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface-2);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      flex-shrink: 0;
    }

    .issue-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .issue-thumb.no-img {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
      opacity: 0.15;
    }

    /* ── Screen / media (TV & film) ── */
    .media-section {
      margin-bottom: 2.5rem;
    }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .media-card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-sm);
      padding: 1.15rem 1.2rem;
      box-shadow: var(--shadow);
    }

    .media-card-type {
      font-size: 0.6875rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .media-card h3 {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.01em;
    }

    .media-meta {
      font-size: 0.8125rem;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 0.85rem;
    }

    .media-meta span {
      display: block;
    }

    .media-links {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
    }

    .media-link {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--link);
      text-decoration: none;
      padding: 0.35rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-pill);
      transition: border-color 0.2s, color 0.2s;
    }

    .media-link:hover {
      border-color: var(--text);
      color: var(--text);
    }

    .issue-list li:last-child { border-bottom: none; }

    .issue-list li:nth-child(even) {
      background: var(--bg-subtle);
    }

    .issue-id {
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }

    .issue-title {
      color: var(--text-secondary);
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .issue-list li,
      .issue-list li.issue-row-no-cover {
        grid-template-columns: 44px 1fr;
        gap: 0.5rem;
      }

      .issue-title { grid-column: 2; }
      .issue-id { grid-column: 2; }
    }

    /* ── Amazon product cards ── */
    .product-grid {
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .product-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.15rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      text-decoration: none;
      color: inherit;
      transition: border-color 0.2s var(--ease), box-shadow 0.2s var(--ease);
    }

    .product-card:hover {
      border-color: var(--text);
      box-shadow: var(--shadow);
    }

    .product-thumb {
      width: 52px;
      height: 78px;
      flex-shrink: 0;
      border-radius: 6px;
      overflow: hidden;
      background: var(--surface-2);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .product-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info { flex: 1; min-width: 0; }

    .product-info h4 {
      font-size: 0.9375rem;
      font-weight: 600;
      margin-bottom: 0.2rem;
      color: var(--text);
    }

    .product-info span {
      font-size: 0.8125rem;
      color: var(--muted);
    }

    .product-cta {
      flex-shrink: 0;
      background: var(--text);
      color: var(--bg);
      font-weight: 600;
      font-size: 0.8125rem;
      padding: 0.55rem 1rem;
      border-radius: var(--radius-pill);
      transition: background 0.2s var(--ease);
    }

    .product-card:hover .product-cta {
      background: var(--accent-hover);
    }

    .disclosure {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 1.25rem;
      line-height: 1.5;
    }

    .subsection-title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
    }

    #page-version .breadcrumb,
    #page-run .breadcrumb,
    #page-all-versions .breadcrumb {
      padding-top: 1.5rem;
    }
  </style>
</head>

    /* Resolve image folder whether you open batman-guide/index.html or ~/batman-guide.html */
    function imageRoot() {
      var path = window.location.pathname || '';
      var filename = path.split('/').pop() || '';
      if (filename === 'batman-guide.html') return 'batman-guide/images/';
      return 'images/';
    }

    function isRemoteImageUrl(url) {
      return /^https?:\/\//i.test(url || '');
    }

    function localRunCover(slug) {
      return imageRoot() + 'covers/runs/' + slug + '.jpg';
    }

    function localRunFinaleCover(slug) {
      return imageRoot() + 'covers/runs/' + slug + '-last.jpg';
    }

    function localVersionCover(versionSlug) {
      return imageRoot() + 'covers/versions/' + versionSlug + '.jpg';
    }

    function localIssueCover(coverSlug) {
      return imageRoot() + 'covers/issues/' + coverSlug + '.jpg';
    }

    function localScreenPoster(screenId) {
      return imageRoot() + 'covers/screen/' + screenId + '.jpg';
    }

    function imdbIdFromUrl(url) {
      var match = (url || '').match(/tt\d{7,8}/);
      return match ? match[0] : null;
    }

    function tmdbPosterUrl(posterPath) {
      if (!posterPath) return null;
      var path = posterPath.charAt(0) === '/' ? posterPath : '/' + posterPath;
      return 'https://image.tmdb.org/t/p/w500' + path;
    }

    const SCREEN_TVMAZE_POSTERS = {
      'gotham-tv': 'https://static.tvmaze.com/uploads/images/medium_portrait/189/474715.jpg',
      'pennyworth-tv': 'https://static.tvmaze.com/uploads/images/medium_portrait/426/1065796.jpg'
    };

    var WIKI_POSTER_CACHE = {};
    var TVMAZE_POSTER_CACHE = {};

    function wikiTitleFromUrl(wikipediaUrl) {
      var raw = decodeURIComponent((wikipediaUrl || '').split('/wiki/').pop() || '');
      return raw.split('#')[0];
    }

    function wikiThumbToFull(thumbUrl) {
      if (!thumbUrl || thumbUrl.indexOf('/thumb/') === -1) return thumbUrl;
      var prefix = thumbUrl.split('/thumb/')[0];
      var parts = thumbUrl.split('/thumb/')[1].split('/');
      if (parts.length < 3) return thumbUrl;
      return prefix + '/' + parts.slice(0, 3).join('/');
    }

    function fetchWikiPoster(wikipediaUrl) {
      if (!wikipediaUrl) return Promise.resolve(null);
      if (WIKI_POSTER_CACHE[wikipediaUrl]) return Promise.resolve(WIKI_POSTER_CACHE[wikipediaUrl]);
      var title = wikiTitleFromUrl(wikipediaUrl);
      return fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title))
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          var src = data && data.thumbnail && data.thumbnail.source;
          if (!src) return null;
          var full = wikiThumbToFull(src);
          WIKI_POSTER_CACHE[wikipediaUrl] = full;
          return full;
        })
        .catch(function() { return null; });
    }

    function applyScreenPosterImg(img, url) {
      if (!img || !url) return;
      img.removeAttribute('crossorigin');
      img.style.display = '';
      img.src = url;
      if (img.parentElement) img.parentElement.classList.remove('no-img');
    }

    function fetchTvmazePoster(imdbUrl) {
      var imdbId = imdbIdFromUrl(imdbUrl);
      if (!imdbId) return Promise.resolve(null);
      if (TVMAZE_POSTER_CACHE[imdbId]) return Promise.resolve(TVMAZE_POSTER_CACHE[imdbId]);
      return fetch('https://api.tvmaze.com/lookup/shows?imdb=' + imdbId)
        .then(function(r) { return r.ok ? r.json() : null; })
        .then(function(data) {
          var src = data && data.image && (data.image.medium || data.image.original);
          if (src) TVMAZE_POSTER_CACHE[imdbId] = src;
          return src || null;
        })
        .catch(function() { return null; });
    }

    function hydrateScreenPosterFromTvmaze(img) {
      if (!img || img.dataset.tvmazeHydrating === 'true' || img.dataset.tvmazeHydrated === 'true') return;
      var imdb = img.getAttribute('data-imdb');
      if (!imdb) return;
      img.dataset.tvmazeHydrating = 'true';
      fetchTvmazePoster(imdb).then(function(url) {
        img.dataset.tvmazeHydrating = 'false';
        if (!url) {
          hydrateScreenPosterFromWiki(img);
          return;
        }
        img.dataset.tvmazeHydrated = 'true';
        if (img.naturalWidth > 0) return;
        applyScreenPosterImg(img, url);
      });
    }

    function hydrateScreenPosterFromWiki(img) {
      if (!img || img.dataset.wikiHydrating === 'true' || img.dataset.wikiHydrated === 'true') return;
      var wiki = img.getAttribute('data-wikipedia');
      if (!wiki) return;
      img.dataset.wikiHydrating = 'true';
      fetchWikiPoster(wiki).then(function(url) {
        img.dataset.wikiHydrating = 'false';
        if (!url) {
          img.style.display = 'none';
          if (img.parentElement) img.parentElement.classList.add('no-img');
          return;
        }
        img.dataset.wikiHydrated = 'true';
        if (img.naturalWidth > 0) return;
        applyScreenPosterImg(img, url);
      });
    }

    function hydrateScreenPosters() {
      document.querySelectorAll('.screen-item-poster img[data-screen-id]').forEach(function(img) {
        var id = img.getAttribute('data-screen-id');
        if (SCREEN_TVMAZE_POSTERS[id] && !img.naturalWidth) {
          applyScreenPosterImg(img, SCREEN_TVMAZE_POSTERS[id]);
        } else if (img.getAttribute('data-imdb') && !SCREEN_TMDB_POSTERS[id]) {
          hydrateScreenPosterFromTvmaze(img);
        } else if (img.getAttribute('data-wikipedia')) {
          hydrateScreenPosterFromWiki(img);
        }
      });
    }

    function getScreenPosterSources(item) {
      if (!item || !item.id) return [];
      var urls = [localScreenPoster(item.id)];
      if (SCREEN_TMDB_POSTERS[item.id]) urls.push(tmdbPosterUrl(SCREEN_TMDB_POSTERS[item.id]));
      if (SCREEN_TVMAZE_POSTERS[item.id]) urls.push(SCREEN_TVMAZE_POSTERS[item.id]);
      if (item.poster) urls.push(item.poster);
      return uniqueUrls(urls);
    }

    function screenPosterTag(item) {
      if (!item || !item.id) return '<div class="screen-item-poster no-img"></div>';
      var cacheKey = 'screen:' + item.id;
      if (!COVER_SOURCES[cacheKey]) COVER_SOURCES[cacheKey] = getScreenPosterSources(item);
      var sources = COVER_SOURCES[cacheKey];
      if (!sources.length) return '<div class="screen-item-poster no-img"></div>';
      var wikiAttr = item.wikipedia ? ' data-wikipedia="' + escAttr(item.wikipedia) + '"' : '';
      var imdbAttr = item.imdb ? ' data-imdb="' + escAttr(item.imdb) + '"' : '';
      return '<div class="screen-item-poster no-img">' +
        '<img src="' + sources[0] + '" alt="' + escAttr(item.title + ' poster') + '" loading="lazy" ' +
        'referrerpolicy="no-referrer" data-screen-id="' + escAttr(item.id) + '"' + wikiAttr + imdbAttr +
        ' data-cover-key="' + escAttr(cacheKey) + '" ' +
        'data-cover-idx="0" onerror="tryNextCover(this)" onload="this.parentElement.classList.remove(\'no-img\')"></div>';
    }

    /* Alternate local filenames in images/ (checked before covers/runs) */
    const RUN_LOCAL_ALIASES = {
      'killing-joke': 'batman-the-killing-joke-graphic-novel-cover',
      'knightfall': 'batman-knightfall-graphicnovel-cover',
      'knightfall-vol-1': 'batman-knightfall-graphicnovel-cover',
      'no-mans-land': 'batman-no-mans-land-graphicnovel-cover',
      'death-of-the-family': 'batman-death-of-the-family-graphicnovel-cover',
      'white-knight': 'batman-white-knight-graphicnovel-cover',
      'batman-who-laughs': 'the-batman-who-laughs',
      'gotham-by-gaslight': 'gotham-by-gaslight-batman',
      'in-darkest-knight': 'in-darkest-knight-batman'
    };

    function getRunLocalImagePaths(slug) {
      var root = imageRoot();
      var paths = [];
      if (RUN_LOCAL_ALIASES[slug]) {
        paths.push(root + RUN_LOCAL_ALIASES[slug] + '.jpg');
      }
      return paths;
    }

    /* Alternate local filenames in images/ (checked before covers/versions) */
    const VERSION_LOCAL_ALIASES = {
      'batman-beyond': 'batman-beyond-2',
      'knightfall-batman': 'batman-knightfall',
      'batman-who-laughs': 'the-batman-who-laughs',
      'gaslight-batman': 'gotham-by-gaslight-batman',
      'darkest-knight-batman': 'in-darkest-knight-batman'
    };

    function getVersionLocalImagePaths(versionSlug) {
      var root = imageRoot();
      var paths = [];
      if (VERSION_LOCAL_ALIASES[versionSlug]) {
        paths.push(root + VERSION_LOCAL_ALIASES[versionSlug] + '.jpg');
      }
      paths.push(root + versionSlug + '.jpg');
      return paths;
    }

    const typeLabels = {
      main: 'Main Continuity',
      multiverse: 'Multiverse',
      elseworlds: 'Elseworlds',
      'dark-multiverse': 'Dark Multiverse',
      future: 'Future'
    };

    function getRunAsin(slug) {
      var run = runs[slug];
      if (!run || !run.amazon || !run.amazon.length) return null;
      return run.amazon[0].asin;
    }

    function uniqueUrls(urls) {
      var seen = {};
      return urls.filter(function(u) {
        if (!u || seen[u]) return false;
        seen[u] = true;
        return true;
      });
    }

    function getCoverSources(slug) {
      var isbn13 = RUN_ISBN[slug];
      var isbn10 = isbn13 ? isbn13.replace(/^978/, '') : null;
      var asin = getRunAsin(slug);
      var urls = getRunLocalImagePaths(slug).concat([localRunCover(slug)]);

      if (COVER_OVERRIDES[slug]) urls.push(COVER_OVERRIDES[slug]);

      if (isbn13) {
        urls.push('https://covers.openlibrary.org/b/isbn/' + isbn13 + '-L.jpg?default=false');
        urls.push('https://covers.openlibrary.org/b/isbn/' + isbn13 + '-M.jpg?default=false');
        urls.push('https://books.google.com/books/content?vid=ISBN:' + isbn13 + '&printsec=frontcover&img=1&zoom=1');
      }
      if (isbn10 && isbn10 !== isbn13) {
        urls.push('https://covers.openlibrary.org/b/isbn/' + isbn10 + '-L.jpg?default=false');
      }

      if (asin) {
        urls.push('https://images-na.ssl-images-amazon.com/images/P/' + asin + '.01._SCMZZZZZZZ_.jpg');
        urls.push('https://images-na.ssl-images-amazon.com/images/P/' + asin + '.01.LZZZZZZZ.jpg');
        urls.push('https://images-na.ssl-images-amazon.com/images/P/' + asin + '.jpg');
      }

      // Fall back to the earliest mapped issue cover for this run, when available.
      var issueSlug = getFirstIssueCoverSlug(slug);
      if (issueSlug) {
        urls = urls.concat(getIssueCoverSources(issueSlug));
      }

      return uniqueUrls(urls);
    }

    function getVersionCoverSources(versionSlug) {
      var version = getVersion(versionSlug);
      if (!version) return [];
      var runSlug = getVersionCoverSlug(version);
      var urls = [];
      // Multiverse: try real run art first (finale, then trade). Avoid leading with
      // usually-missing version alias paths — those 404s burn the fallback chain on host.
      if (runSlug) urls.push(localRunFinaleCover(runSlug));
      var lastIssue = runSlug ? getLastIssueCoverSlug(runSlug) : null;
      if (lastIssue) urls = urls.concat(getIssueCoverSources(lastIssue));
      if (runSlug) urls.push(localRunCover(runSlug));
      if (runSlug) urls = urls.concat(getCoverSources(runSlug).slice(1));
      urls = urls.concat(getVersionLocalImagePaths(versionSlug)).concat([localVersionCover(versionSlug)]);
      // Curated Wikipedia last — often the same portrait across sibling versions.
      if (VERSION_ART[versionSlug]) urls.push(VERSION_ART[versionSlug]);
      return uniqueUrls(urls);
    }

    function preferUniqueVersionSources(sources, claimedRemotes) {
      var preferred = [];
      var deferred = [];
      (sources || []).forEach(function(url) {
        if (!isRemoteImageUrl(url) || !claimedRemotes[url]) preferred.push(url);
        else deferred.push(url);
      });
      return uniqueUrls(preferred.concat(deferred));
    }

    function buildCoverSourceIndex() {
      Object.keys(runs).forEach(function(slug) {
        COVER_SOURCES['run:' + slug] = getCoverSources(slug);
      });
      var claimedRemotes = {};
      versions.forEach(function(v) {
        var sources = preferUniqueVersionSources(getVersionCoverSources(v.slug), claimedRemotes);
        COVER_SOURCES['version:' + v.slug] = sources;
        // Claim the first remote that may display so siblings don't share Multiverse art.
        for (var i = 0; i < sources.length; i++) {
          if (isRemoteImageUrl(sources[i])) {
            claimedRemotes[sources[i]] = true;
            break;
          }
        }
      });
      BATMAN_SCREEN.forEach(function(group) {
        group.items.forEach(function(item) {
          COVER_SOURCES['screen:' + item.id] = getScreenPosterSources(item);
        });
      });
    }

    function escAttr(str) {
      return String(str || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
    }

    window.tryNextCover = function(img) {
      var key = img.getAttribute('data-cover-key');
      var sources = COVER_SOURCES[key] || [];
      var idx = parseInt(img.getAttribute('data-cover-idx') || '0', 10) + 1;
      if (idx < sources.length) {
        img.setAttribute('data-cover-idx', idx);
        // Never force CORS on Multiverse banners — Open Library / Amazon / CV often
        // omit ACAO, and crossOrigin then fires onerror so the card stays blank.
        img.removeAttribute('crossorigin');
        img.style.display = '';
        if (img.parentElement) img.parentElement.classList.remove('no-img');
        img.src = sources[idx];
        if (img.getAttribute('data-featured-theme') === 'true') {
          if (img.complete && img.naturalWidth) applyFeaturedThemeFromImg(img);
          else img.addEventListener('load', function onFeaturedThemeLoad() {
            img.removeEventListener('load', onFeaturedThemeLoad);
            applyFeaturedThemeFromImg(img);
          });
        }
        return;
      }
      img.style.display = 'none';
      if (img.getAttribute('data-imdb')) {
        hydrateScreenPosterFromTvmaze(img);
        return;
      }
      if (img.getAttribute('data-wikipedia')) {
        hydrateScreenPosterFromWiki(img);
        return;
      }
      if (img.parentElement) img.parentElement.classList.add('no-img');
      if (key && key.indexOf('run:') === 0) {
        hydrateRunCoverFromFirstIssue(img);
      }
      if (img.getAttribute('data-hero') === 'true') {
        hydrateHeroFromWikipedia(img);
      }
      if (img.getAttribute('data-featured-theme') === 'true') {
        hydrateFeaturedFromWikipedia(img);
      }
    };

    window.tryNextHero = function(img) {
      window.tryNextCover(img);
    };

    function hydrateFeaturedFromWikipedia(img) {
      if (!img || img.dataset.featuredWiki === 'true' || img.dataset.featuredWiki === 'pending') return;
      var slug = img.getAttribute('data-featured-slug') || '';
      var version = slug ? getVersion(slug) : null;
      var wiki = (version && version.wikipedia) || img.getAttribute('data-wikipedia') || '';
      if (!wiki) return;
      var title = '';
      try {
        var parts = wiki.split('/wiki/');
        title = parts.length > 1 ? decodeURIComponent(parts[1].split('#')[0]) : '';
      } catch (err) { title = ''; }
      if (!title) return;
      img.dataset.featuredWiki = 'pending';
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')), {
        headers: { 'Accept': 'application/json' }
      }).then(function(resp) { return resp.ok ? resp.json() : null; }).then(function(data) {
        var url = data && ((data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source));
        if (!url) {
          img.dataset.featuredWiki = 'false';
          return;
        }
        img.dataset.featuredWiki = 'true';
        img.style.display = '';
        if (img.parentElement) img.parentElement.classList.remove('no-img');
        img.removeAttribute('crossorigin');
        img.onload = function() { applyFeaturedThemeFromImg(img); };
        img.src = url;
      }).catch(function() {
        img.dataset.featuredWiki = 'false';
      });
    }

    function hydrateHeroFromWikipedia(img) {
      if (!img || img.dataset.heroWiki === 'true' || img.dataset.heroWiki === 'pending') return;
      var wiki = img.getAttribute('data-wikipedia');
      if (!wiki) {
        applyHeroGradientFallback(img);
        return;
      }
      var title = '';
      try {
        var parts = wiki.split('/wiki/');
        title = parts.length > 1 ? decodeURIComponent(parts[1]) : '';
      } catch (err) { title = ''; }
      if (!title) {
        applyHeroGradientFallback(img);
        return;
      }
      img.dataset.heroWiki = 'pending';
      fetch('https://en.wikipedia.org/api/rest_v1/page/summary/' + encodeURIComponent(title.replace(/ /g, '_')), {
        headers: { 'Accept': 'application/json' }
      }).then(function(resp) { return resp.ok ? resp.json() : null; }).then(function(data) {
        var url = data && ((data.originalimage && data.originalimage.source) || (data.thumbnail && data.thumbnail.source));
        if (!url) {
          img.dataset.heroWiki = 'false';
          applyHeroGradientFallback(img);
          return;
        }
        img.dataset.heroWiki = 'true';
        img.style.display = '';
        if (img.parentElement) img.parentElement.classList.remove('no-img');
        img.onerror = function() { applyHeroGradientFallback(img); };
        img.src = url;
      }).catch(function() {
        img.dataset.heroWiki = 'false';
        applyHeroGradientFallback(img);
      });
    }

    function applyHeroGradientFallback(img) {
      if (!img || !img.parentElement) return;
      img.style.display = 'none';
      var gradient = img.parentElement.getAttribute('data-hero-gradient');
      if (gradient) img.parentElement.style.background = gradient;
    }

    function getFirstIssueCoverSlug(slug) {
      var data = getRunIssueData(slug);
      for (var i = 0; i < data.issues.length; i++) {
        if (data.issues[i] && data.issues[i].coverSlug) return data.issues[i].coverSlug;
      }
      return null;
    }

    function getLastIssueCoverSlug(slug) {
      var data = getRunIssueData(slug);
      for (var i = data.issues.length - 1; i >= 0; i--) {
        if (data.issues[i] && data.issues[i].coverSlug) return data.issues[i].coverSlug;
      }
      return null;
    }

    function firstIssueSearchQuery(run) {
      if (!run) return '';
      var collects = (run.collects || '').trim();
      if (collects) {
        var first = collects.split(',')[0].trim();
        first = first.replace(/#(\d+)\s*[–\-—]\s*\d+/g, '#$1');
        first = first.replace(/\s+and\s+related$/i, '').trim();
        if (first && !/^(selected|various|crossover|related)\b/i.test(first)) {
          return first;
        }
      }
      if (run.readingOrder && run.readingOrder.length) {
        return String(run.readingOrder[0]).trim();
      }
      return run.title || '';
    }

    function preferLargeGoogleCover(url) {
      if (!url) return null;
      url = String(url).replace(/^http:\/\//i, 'https://');
      if (/zoom=\d+/.test(url)) url = url.replace(/zoom=\d+/, 'zoom=0');
      else url += (url.indexOf('?') >= 0 ? '&' : '?') + 'zoom=0';
      return url;
    }

    function coverSearchTokens(title) {
      return String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim().split(/\s+/).filter(function(t) {
        return t.length > 2 && ['the', 'and', 'vol', 'volume', 'omnibus'].indexOf(t) === -1;
      });
    }

    function scoreCoverCandidate(haystack, wantTitle) {
      var want = coverSearchTokens(wantTitle);
      var hay = String(haystack || '').toLowerCase();
      if (!want.length || !hay) return 0;
      var hit = 0;
      for (var i = 0; i < want.length; i++) {
        if (hay.indexOf(want[i]) !== -1) hit++;
      }
      var score = hit / want.length;
      var tail = want.slice(-2).join(' ');
      if (tail && hay.indexOf(tail) !== -1) score += 0.35;
      return score;
    }

    function hydrateRunCoverFromFirstIssue(img) {
      if (!img || img.dataset.issueHydrated === 'true' || img.dataset.issueHydrating === 'true') return;
      var key = img.getAttribute('data-cover-key') || '';
      if (key.indexOf('run:') !== 0) return;
      var run = runs[key.slice(4)];
      // Prefer the collected-edition title so Open Library doesn't latch onto a wrong first hit
      // (e.g. "Secret Origin" → "No Fear"). Issue-level query is a secondary attempt only.
      var query = (run && run.title) || firstIssueSearchQuery(run);
      if (!query) return;
      img.dataset.issueHydrating = 'true';

      function applyUrl(url) {
        if (!url) return false;
        img.dataset.issueHydrated = 'true';
        img.dataset.issueHydrating = 'false';
        img.style.display = '';
        if (img.parentElement) img.parentElement.classList.remove('no-img');
        img.onerror = function() {
          img.style.display = 'none';
          if (img.parentElement) img.parentElement.classList.add('no-img');
        };
        img.src = url;
        return true;
      }

      function pickOpenLibraryCover(docs, wantTitle) {
        var best = null;
        var bestScore = 0;
        for (var i = 0; i < (docs || []).length; i++) {
          var d = docs[i];
          if (!d || !d.cover_i) continue;
          var hay = [d.title, d.subtitle, (d.author_name || []).join(' ')].join(' ');
          var s = scoreCoverCandidate(hay, wantTitle);
          if (s > bestScore) {
            best = d;
            bestScore = s;
          }
        }
        if (best && bestScore >= 0.55) {
          return 'https://covers.openlibrary.org/b/id/' + best.cover_i + '-L.jpg';
        }
        return null;
      }

      function pickGoogleCover(items, wantTitle) {
        var bestUrl = null;
        var bestScore = 0;
        for (var j = 0; j < (items || []).length; j++) {
          var info = (items[j] && items[j].volumeInfo) || {};
          var links = info.imageLinks || {};
          var raw = links.extraLarge || links.large || links.medium || links.thumbnail || links.smallThumbnail;
          if (!raw) continue;
          var hay = [info.title, info.subtitle, (info.authors || []).join(' ')].join(' ');
          var s = scoreCoverCandidate(hay, wantTitle);
          if (s > bestScore) {
            bestScore = s;
            bestUrl = preferLargeGoogleCover(raw);
          }
        }
        return bestScore >= 0.55 ? bestUrl : null;
      }

      fetch('https://openlibrary.org/search.json?q=' + encodeURIComponent(query) + '&limit=12', {
        headers: { 'Accept': 'application/json' }
      }).then(function(resp) {
        return resp.ok ? resp.json() : null;
      }).then(function(data) {
        var wantTitle = (run && run.title) || query;
        var url = pickOpenLibraryCover((data && data.docs) || [], wantTitle);
        if (url && applyUrl(url)) return null;
        return fetch('https://www.googleapis.com/books/v1/volumes?q=' + encodeURIComponent('intitle:' + wantTitle) + '&maxResults=8', {
          headers: { 'Accept': 'application/json' }
        }).then(function(resp) {
          return resp.ok ? resp.json() : null;
        });
      }).then(function(gdata) {
        if (!gdata || img.dataset.issueHydrated === 'true') return;
        var wantTitle = (run && run.title) || query;
        var url = pickGoogleCover(gdata.items || [], wantTitle);
        if (url && applyUrl(url)) return;
        img.dataset.issueHydrating = 'false';
      }).catch(function() {
        img.dataset.issueHydrating = 'false';
      });
    }

    function colorLuminance(r, g, b) {
      return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
    }

    function normalizeFeaturedColor(c) {
      if (!c) return { r: 28, g: 24, b: 32 };
      var lum = colorLuminance(c.r, c.g, c.b);
      if (lum <= 0.38) return c;
      var factor = 0.32 / lum;
      return {
        r: Math.min(255, Math.round(c.r * factor)),
        g: Math.min(255, Math.round(c.g * factor)),
        b: Math.min(255, Math.round(c.b * factor))
      };
    }

    function extractImageDarkColor(img) {
      var w = 48;
      var h = 48;
      var canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      var ctx = canvas.getContext('2d');
      if (!ctx) return null;
      try {
        ctx.drawImage(img, 0, 0, w, h);
        var data = ctx.getImageData(0, 0, w, h).data;
        var darkR = 0, darkG = 0, darkB = 0, darkN = 0;
        var allR = 0, allG = 0, allB = 0, allN = 0;
        for (var y = 0; y < h; y++) {
          var rowWeight = y / h;
          if (rowWeight < 0.35) continue;
          for (var x = 0; x < w; x++) {
            var i = (y * w + x) * 4;
            if (data[i + 3] < 100) continue;
            var pr = data[i];
            var pg = data[i + 1];
            var pb = data[i + 2];
            var weight = 1 + rowWeight * 2;
            allR += pr * weight;
            allG += pg * weight;
            allB += pb * weight;
            allN += weight;
            if (colorLuminance(pr, pg, pb) < 0.52) {
              darkR += pr * weight;
              darkG += pg * weight;
              darkB += pb * weight;
              darkN += weight;
            }
          }
        }
        if (darkN > 6) {
          return normalizeFeaturedColor({
            r: Math.round(darkR / darkN),
            g: Math.round(darkG / darkN),
            b: Math.round(darkB / darkN)
          });
        }
        if (allN) {
          return normalizeFeaturedColor({
            r: Math.round(allR / allN),
            g: Math.round(allG / allN),
            b: Math.round(allB / allN)
          });
        }
        return null;
      } catch (e) {
        return null;
      }
    }

    function buildFeaturedOverlayGradient(c) {
      // Bottom stays near-black for readable white type; mid/upper bands keep the card's color.
      var deepR = Math.round(c.r * 0.42);
      var deepG = Math.round(c.g * 0.42);
      var deepB = Math.round(c.b * 0.42);
      var midR = Math.round(c.r * 0.72);
      var midG = Math.round(c.g * 0.72);
      var midB = Math.round(c.b * 0.72);
      return 'linear-gradient(to top, ' +
        'rgba(0,0,0,0.92) 0%, ' +
        'rgba(' + deepR + ',' + deepG + ',' + deepB + ',0.9) 20%, ' +
        'rgba(' + midR + ',' + midG + ',' + midB + ',0.72) 42%, ' +
        'rgba(' + midR + ',' + midG + ',' + midB + ',0.38) 64%, ' +
        'rgba(' + c.r + ',' + c.g + ',' + c.b + ',0.14) 82%, ' +
        'rgba(0,0,0,0.06) 100%)';
    }

    function buildFeaturedCardGradient(c) {
      return buildFeaturedOverlayGradient(c);
    }

    var DEFAULT_FEATURED_THEME = { r: 28, g: 24, b: 32 };

    var FEATURED_THEME_COLORS = {
      'prime-earth-batman': { r: 72, g: 18, b: 14 },
      'batman-beyond': { r: 52, g: 18, b: 62 },
      'batman-one-million': { r: 48, g: 38, b: 12 },
      'knightfall-batman': { r: 32, g: 22, b: 52 },
      'earth-two-batman': { r: 44, g: 30, b: 18 }
    };

    function getFeaturedThemeColor(slug, imgColor) {
      // Prefer curated per-card colors so Multiverse rows stay distinct;
      // fall back to image sampling only when no theme is mapped.
      return normalizeFeaturedColor(FEATURED_THEME_COLORS[slug] || imgColor || DEFAULT_FEATURED_THEME);
    }

    function applyFeaturedCardTheme(link, copy, c) {
      if (!link || !copy || !c) return;
      var overlay = link.querySelector('.featured-version-overlay');
      if (overlay) overlay.style.background = buildFeaturedOverlayGradient(c);
      link.style.setProperty('--featured-theme-rgb', c.r + ', ' + c.g + ', ' + c.b);
      copy.classList.add('featured-version-copy--on-dark');
    }

    window.applyFeaturedThemeFromImg = function(img) {
      var copyId = img.getAttribute('data-featured-copy');
      var copy = copyId ? document.getElementById(copyId) : null;
      var link = img.closest('.featured-version-link');
      if (!copy || !link || !img || img.getAttribute('data-featured-theme') !== 'true') return;
      var slug = img.getAttribute('data-featured-slug') || '';
      var c = getFeaturedThemeColor(slug, extractImageDarkColor(img));
      applyFeaturedCardTheme(link, copy, c);
    };

    function featuredImgTag(versionSlug, alt, copyId) {
      var cacheKey = 'version:' + versionSlug;
      COVER_SOURCES[cacheKey] = getVersionCoverSources(versionSlug);
      var sources = COVER_SOURCES[cacheKey];
      if (!sources.length) return '';
      // No crossorigin: display first; theme sampling falls back to per-slug presets
      // when the canvas is tainted.
      return '<img src="' + sources[0] + '" alt="' + escAttr(alt) + '" loading="eager" ' +
        'referrerpolicy="no-referrer" data-cover-key="' + escAttr(cacheKey) + '" ' +
        'data-cover-idx="0" data-featured-theme="true" data-featured-slug="' + escAttr(versionSlug) + '" ' +
        'data-featured-copy="' + escAttr(copyId) + '" ' +
        'onload="applyFeaturedThemeFromImg(this)" onerror="tryNextCover(this)">';
    }

    function initFeaturedRows() {
      document.querySelectorAll('img[data-featured-theme="true"]').forEach(function(img) {
        var copyId = img.getAttribute('data-featured-copy');
        var copy = copyId ? document.getElementById(copyId) : null;
        var link = img.closest('.featured-version-link');
        var slug = img.getAttribute('data-featured-slug') || '';
        applyFeaturedCardTheme(link, copy, getFeaturedThemeColor(slug, null));
        if (img.complete && img.naturalWidth) applyFeaturedThemeFromImg(img);
      });
    }

    function coverUrl(slug, kind) {
      kind = kind || 'run';
      var key = kind + ':' + slug;
      if (!COVER_SOURCES[key]) {
        COVER_SOURCES[key] = kind === 'version'
          ? getVersionCoverSources(slug)
          : getCoverSources(slug);
      }
      return COVER_SOURCES[key].length ? COVER_SOURCES[key][0] : '';
    }

    function imgTag(key, alt, kind) {
      kind = kind || 'run';
      var cacheKey = kind + ':' + key;
      if (!COVER_SOURCES[cacheKey]) {
        COVER_SOURCES[cacheKey] = kind === 'version'
          ? getVersionCoverSources(key)

      var sources = COVER_SOURCES[cacheKey];
